[project]
name = "diag360"
version = "0.1.0"
description = "Diagnostiquer la résilience territoriale pour mieux agir sur du long terme pour les collectivités"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "requests",
    "duckdb",
    "geopandas",
    "shapely",
    "openpyxl",
]

[dependency-groups]
dev = [
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Seul `utils` est un paquet importable ; `scr/` contient des scripts à lancer.
packages = ["utils"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebook", "fichier_source", "data"]

[tool.ruff.lint]
# E/W : style pycodestyle, F : pyflakes, I : tri des imports, UP : syntaxe moderne
select = ["E", "W", "F", "I", "UP"]
# Les URLs et requêtes SQL dépassent souvent la longueur de ligne
ignore = ["E501"]
